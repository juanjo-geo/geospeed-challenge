project_id = "motyvjfhupmvmfpgftku"

# Los tokens de sesión del proyecto se firman con ES256 (llaves nuevas). Con verify_jwt activo
# el gateway solo acepta JWT firmados con el secreto legado y rechaza con 401 a todo jugador con
# sesión (incluidas las anónimas). La función valida sus datos y escribe con service role.
[functions.submit-score]
verify_jwt = false

# Mercado Pago llama al webhook sin JWT; el checkout valida la sesión por su cuenta (getUser).
[functions.mercadopago-webhook]
verify_jwt = false

[functions.mercadopago-checkout]
verify_jwt = false
