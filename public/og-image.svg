<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07130a"/>
      <stop offset="100%" stop-color="#0A0E18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#d4a832"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Gold border -->
  <rect x="20" y="20" width="1160" height="590" rx="16" fill="none" stroke="#f5c842" stroke-width="2" opacity="0.3"/>
  <!-- Pin icon -->
  <text x="600" y="200" font-size="100" text-anchor="middle" fill="#f5c842">📍</text>
  <!-- Title -->
  <text x="600" y="320" font-family="Impact, Arial Black, sans-serif" font-size="72" font-weight="900" fill="#f5c842" text-anchor="middle" letter-spacing="4">GEOSPEED IQ</text>
  <text x="600" y="390" font-family="Impact, Arial Black, sans-serif" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="6">CHALLENGE</text>
  <!-- Tagline -->
  <text x="600" y="460" font-family="Arial, sans-serif" font-size="28" fill="#cccccc" text-anchor="middle">¿Cuánto conoces el mundo?</text>
  <!-- Features -->
  <text x="600" y="530" font-family="Arial, sans-serif" font-size="20" fill="#888888" text-anchor="middle">5 Modos de Juego  •  180+ Ciudades  •  Desafío Diario  •  Duelos 1v1</text>
  <!-- Bottom accent -->
